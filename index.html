<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ Music Player - SMPN 9 Sinjai</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: #0d0f17;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .dj-card {
      background: #161925;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 242, 254, 0.15), 0 0 20px rgba(254, 0, 242, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    /* Vinyl / Disc DJ Styling */
    .disc-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 20px auto;
    }
    .vinyl-disc {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #111 25%, #222 26%, #000 70%, #111 100%);
      border-radius: 50%;
      border: 4px solid #1f2430;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: spin 4s linear infinite;
      animation-play-state: paused;
    }
    .vinyl-disc.playing {
      animation-play-state: running;
    }
    .vinyl-center {
      width: 50px;
      height: 50px;
      background: linear-gradient(45deg, #00f2fe, #fe00f2);
      border-radius: 50%;
      border: 5px solid #000;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 16px;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Track Info */
    .song-title {
      font-size: 18px;
      font-weight: 600;
      color: #00f2fe;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 13px;
      color: #a0aec0;
      margin-bottom: 20px;
    }

    /* Progress Bar */
    .progress-area {
      margin-bottom: 15px;
    }
    .progress-bar-container {
      height: 6px;
      width: 100%;
      background: #2d3748;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f2fe, #fe00f2);
      border-radius: 10px;
    }
    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #a0aec0;
      margin-top: 6px;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    .btn-control {
      background: #232738;
      border: none;
      color: #fff;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-control:hover {
      background: #2d3248;
      color: #00f2fe;
    }
    .btn-play {
      width: 60px;
      height: 60px;
      background: linear-gradient(45deg, #00f2fe, #fe00f2);
      font-size: 22px;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    /* Volume Slider */
    .volume-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #a0aec0;
    }
    .volume-container input[type="range"] {
      accent-color: #00f2fe;
      cursor: pointer;
    }

    /* Playlist Section */
    .playlist-title {
      text-align: left;
      font-size: 13px;
      color: #fe00f2;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .playlist {
      max-height: 160px;
      overflow-y: auto;
      text-align: left;
      padding-right: 5px;
    }
    .playlist::-webkit-scrollbar {
      width: 4px;
    }
    .playlist::-webkit-scrollbar-thumb {
      background: #2d3748;
      border-radius: 4px;
    }
    .playlist-item {
      padding: 10px;
      background: #1f2430;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .playlist-item:hover {
      background: #2a3040;
    }
    .playlist-item.active {
      border-left: 3px solid #00f2fe;
      background: rgba(0, 242, 254, 0.1);
      color: #00f2fe;
    }
    .playlist-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 230px;
    }
  </style>
</head>
<body>

<div class="dj-card">
  <!-- Piringan Hitam DJ -->
  <div class="disc-container">
    <div class="vinyl-disc" id="vinyl">
      <div class="vinyl-center">
        <i class="fa-solid fa-compact-disc"></i>
      </div>
    </div>
  </div>

  <!-- Info Lagu -->
  <div class="song-title" id="title">Memuat...</div>
  <div class="song-artist" id="artist">SMPN 9 Sinjai</div>

  <!-- Progress Bar -->
  <div class="progress-area">
    <div class="progress-bar-container" id="progress-container">
      <div class="progress-bar" id="progress"></div>
    </div>
    <div class="time-info">
      <span id="current-time">00:00</span>
      <span id="duration">00:00</span>
    </div>
  </div>

  <!-- Control Buttons -->
  <div class="controls">
    <button class="btn-control" onclick="prevTrack()"><i class="fa-solid fa-backward-step"></i></button>
    <button class="btn-control btn-play" id="btn-play" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
    <button class="btn-control" onclick="nextTrack()"><i class="fa-solid fa-forward-step"></i></button>
  </div>

  <!-- Volume -->
  <div class="volume-container">
    <i class="fa-solid fa-volume-low"></i>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" oninput="changeVolume(this.value)">
    <i class="fa-solid fa-volume-high"></i>
  </div>

  <!-- Playlist UI -->
  <div class="playlist-title">
    <span><i class="fa-solid fa-list-ul"></i> RANDOM PLAYLIST</span>
    <span style="font-size:10px; color:#a0aec0;">Auto-shuffled</span>
  </div>
  <div class="playlist" id="playlist-ui"></div>
</div>

<script>
  /* =====================================================
     DATA PLAYLIST
  ===================================================== */
  const musicFolder = "https://beita.smpn9sinjai.sch.id/music/";

  let rawSongs = [
    { judul: "Kita Bersahabat", artis: "Music DJ", file: musicFolder + "Kita Bersahabat.mp3" },
    { judul: "Maafkan Saya Pak Guru Ibu Guru", artis: "Music DJ", file: musicFolder + "Maafkan Saya Pak Guru Ibu Guru.mp3" },
    { judul: "Menasehati Siswa", artis: "Music DJ", file: musicFolder + "Menasehati Siswa.mp3" },
    { judul: "Orang Tua Kedua", artis: "Music DJ", file: musicFolder + "Orang Tua Kedua.mp3" },
    { judul: "Sampai Jumpa, Kawan", artis: "Music DJ", file: musicFolder + "Sampai Jumpa, Kawan.mp3" }
  ];

  // Acak lagu setiap kali refresh halaman
  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  const songs = shuffleArray([...rawSongs]);

  /* =====================================================
     STATE & AUDIO INITIALIZATION
  ===================================================== */
  let currentIndex = 0;
  const audio = new Audio();
  audio.preload = "auto";
  let isPlaying = false;
  let wakeLock = null;

  const vinyl = document.getElementById('vinyl');
  const btnPlay = document.getElementById('btn-play');
  const progressBar = document.getElementById('progress');
  const progressContainer = document.getElementById('progress-container');

  // Mencegah HP sleep
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (err) { console.log(err); }
  }

  // Render Playlist UI & Ambil Durasi Tiap Lagu
  const playlistUI = document.getElementById('playlist-ui');
  songs.forEach((song, index) => {
    const item = document.createElement('div');
    item.className = 'playlist-item' + (index === 0 ? ' active' : '');
    item.onclick = () => loadAndPlay(index);
    
    item.innerHTML = `
      <div class="playlist-item-title">${index + 1}. ${song.judul}</div>
      <div id="duration-item-${index}">--:--</div>
    `;
    playlistUI.appendChild(item);

    // Ambil Durasi Masing-Masing Lagu di Latar Belakang
    const tempAudio = new Audio(song.file);
    tempAudio.addEventListener('loadedmetadata', () => {
      document.getElementById(`duration-item-${index}`).innerText = formatTime(tempAudio.duration);
    });
  });

  /* =====================================================
     PLAYER LOGIC
  ===================================================== */
  function loadAndPlay(index) {
    if (index < 0 || index >= songs.length) return;
    
    currentIndex = index;
    const currentSong = songs[currentIndex];

    audio.pause();
    audio.currentTime = 0;
    audio.src = currentSong.file;
    audio.load();

    audio.play().then(() => {
      isPlaying = true;
      updateUI();
      setupMediaSession(currentSong);
      requestWakeLock();
    }).catch(err => console.error(err));
  }

  function togglePlay() {
    if (!audio.src) {
      loadAndPlay(0);
      return;
    }
    if (isPlaying) {
      audio.pause();
      isPlaying = false;
    } else {
      audio.play();
      isPlaying = true;
      requestWakeLock();
    }
    updateUI();
  }

  function nextTrack() {
    currentIndex = (currentIndex + 1) % songs.length;
    loadAndPlay(currentIndex);
  }

  function prevTrack() {
    currentIndex = (currentIndex - 1 + songs.length) % songs.length;
    loadAndPlay(currentIndex);
  }

  function changeVolume(val) {
    audio.volume = val;
  }

  /* =====================================================
     PROGRESS BAR & TIME FORMATTING
  ===================================================== */
  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      const progressPercent = (audio.currentTime / audio.duration) * 100;
      progressBar.style.width = `${progressPercent}%`;
      document.getElementById('current-time').innerText = formatTime(audio.currentTime);
      document.getElementById('duration').innerText = formatTime(audio.duration);
    }
  });

  progressContainer.addEventListener('click', (e) => {
    const width = progressContainer.clientWidth;
    const clickX = e.offsetX;
    if (audio.duration) {
      audio.currentTime = (clickX / width) * audio.duration;
    }
  });

  function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
  }

  function updateUI() {
    const currentSong = songs[currentIndex];
    document.getElementById('title').innerText = currentSong.judul;
    document.getElementById('artist').innerText = currentSong.artis;
    
    btnPlay.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';

    if (isPlaying) {
      vinyl.classList.add('playing');
    } else {
      vinyl.classList.remove('playing');
    }

    const items = playlistUI.getElementsByClassName('playlist-item');
    Array.from(items).forEach((item, idx) => {
      item.classList.toggle('active', idx === currentIndex);
    });
  }

  /* =====================================================
     MEDIA SESSION (LOCKSCREEN CONTROL)
  ===================================================== */
  function setupMediaSession(song) {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: song.judul,
        artist: song.artis,
        album: "DJ Night - SMPN 9 Sinjai",
        artwork: [{ src: 'https://beita.smpn9sinjai.sch.id/favicon.ico', sizes: '96x96', type: 'image/x-icon' }]
      });

      navigator.mediaSession.setActionHandler('play', () => { audio.play(); isPlaying = true; updateUI(); });
      navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); isPlaying = false; updateUI(); });
      navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
      navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
    }
  }

  audio.addEventListener('ended', nextTrack);
</script>

</body>
</html>
